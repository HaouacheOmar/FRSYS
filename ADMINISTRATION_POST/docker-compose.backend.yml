version: "3.9"

services:
  db:
    image: postgres:16
    container_name: fr_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-frsys}
      POSTGRES_USER: ${DB_USER:-frsys}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-frsys_password}
    ports:
      - "5432:5432"
    volumes:
      - fr_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-frsys} -d ${DB_NAME:-frsys}"]
      interval: 10s
      timeout: 5s
      retries: 10

  model:
    build:
      context: ./MODEL_SERVER
    container_name: fr_model
    restart: unless-stopped
    environment:
      DJANGO_SERVER_URL: http://django:8000
      FACE_DB_PATH: /data/faces
    ports:
      - "5000:5000"
    volumes:
      - ${FACE_PHOTO_DIR:-./face_photos}:/data/faces

  django:
    build:
      context: ./DJANGO_SERVER
    container_name: fr_django
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      model:
        condition: service_started
    environment:
      DEBUG: ${DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-backend-env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,192.168.1.105,192.168.1.104}
      DB_NAME: ${DB_NAME:-frsys}
      DB_USER: ${DB_USER:-frsys}
      DB_PASSWORD: ${DB_PASSWORD:-frsys_password}
      DB_HOST: db
      DB_PORT: 5432
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-Lax}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-0}
      CAMERA_CREDENTIALS_KEY: ${CAMERA_CREDENTIALS_KEY:-}
    ports:
      - "8000:8000"

volumes:
  fr_pg_data:
