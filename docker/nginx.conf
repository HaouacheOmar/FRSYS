server {
    listen 80;
    root /usr/share/nginx/html;

    # Photos zip / Excel uploads (Django caps the zip at 500 MB uncompressed).
    client_max_body_size 600m;

    # Django: REST API and admin. $http_host keeps the browser's host:port, which Django's
    # ALLOWED_HOSTS and same-origin CSRF check rely on.
    location ~ ^/(api|admin)/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;   # camera ping_all takes up to ~10 s
    }

    # Django WebSockets (camera stream, presence, admin notifications).
    location /ws/ {
        proxy_pass http://django:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    # React routes (/home, /video-stream/, ...) all load the SPA.
    location / {
        try_files $uri /index.html;
    }
}
