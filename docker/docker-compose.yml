# FRSYS stack. From this folder:  cp .env.example .env  (fill it in)  then  docker compose up -d --build
# The app is served on http://<this PC>:${CLIENT_PORT}; nginx (client) proxies /api, /ws and /admin
# to Django, so only that one port is published. Postgres and the model server stay internal.

name: frsys

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  model:
    build:
      context: ..
      dockerfile: docker/model.Dockerfile
    restart: unless-stopped
    environment:
      FACE_DB_PATH: /data/faces
      MODEL_SERVER_TOKEN: ${MODEL_SERVER_TOKEN}
    volumes:
      - ./photos:/data/faces:ro
      - model_cache:/root/.insightface   # buffalo_l is downloaded on first start (~300 MB)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  django:
    build:
      context: ..
      dockerfile: docker/django.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      FACE_DB_PATH: /data/faces
      MODEL_SERVER_URL: http://model:5000
      CORS_ALLOWED_ORIGINS: ${SITE_ORIGINS}
    volumes:
      - ./photos:/data/faces
      - django_migrations:/app/server/migrations
    depends_on:
      db:
        condition: service_healthy
      model:
        condition: service_started   # Django shows "model server unavailable" until it's ready

  client:
    build:
      context: ..
      dockerfile: docker/client.Dockerfile
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - django

volumes:
  db_data:
  model_cache:
  django_migrations:
